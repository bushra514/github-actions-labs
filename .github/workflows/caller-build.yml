name: Caller workflow

on:
  workflow_dispatch:

jobs:
  call-reusable-build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      environment: staging
    secrets:
      Azure_Client_Secret: ${{secrets.Azure}}
      
  display-version:
    runs-on: ubuntu-latest
    needs: call-reusable-build

    steps:
     - run: echo "version is ${{needs.call-reusable-build.outputs.version}}"
  