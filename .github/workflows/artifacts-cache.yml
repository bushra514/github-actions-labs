name: artifacts and cache

on:
  workflow_dispatch:

jobs:
  artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo in the runner to build an artifact
        uses: actions/checkout@v4
        # run: echo "Checkout completed"  #can't write run along with uses as uses executes an existing action  

      - name: build an artifact
        run:  |
          mkdir -p dist/
          tar -czvf dist/app.tar.gz app/app.py

      - name: Upload an artifact on github
        uses: actions/upload-artifact@v7
        with:
          name: python-app
          path: dist/app.tar.gz

############cache

  cache:
    runs-on: ubuntu-latest

    steps:
      - name: checkout the code 
        uses: actions/checkout@v7

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: check if the cache exists in github cache storage
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{runner.os}}-pip-${{hashfiles('app/requirements.txt')}}

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run test  
        run: |
           pytest
           echo "Pytest successfull"
            

