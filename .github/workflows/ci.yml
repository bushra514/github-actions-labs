name : worflow-lab-1

on:
  push:
    branches:
      - features

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:
  code-check:
    name: Starting code checks
    runs-on: ubuntu-latest
     
    steps:
      - name: Check if the file exists
        uses: actions/checkout@v4

      - name: verify if the file exists
        run: test -f app/app.py

  
  #2nd job to run the tests

  test:
    name: Running the tests
    runs-on : ubuntu-latest
    needs: code-check

    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: run tests
        run: pytest -v app/

    
  build:
    name: Build the package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout the code
        uses: actions/Checkout@v4

      - name: Setup python
        uses: actions/checkout@v4
        with:
          python-version: '3.12'

      - name: create a directory
        run: | 
          mkdir -p dist
          tar -czf dist/application.tar.gz app/app.py

      - name: upload the zipped file for downloading
        uses: actions/upload-artifact@v5
        with:
          name: python-application
          path: dist/application.tar.gz

  worflow-info:
    runs-on: ubuntu-latest
    env:
      APP_NAME: compose-app

    steps: 
      - name: variables printing
        run: |
          echo "Application: $APP_NAME"
          echo "Repository: ${{github.repository}}"
          echo "Actor: ${{github.actor}}"
          echo "Runner: ${{runner.os}}"


  variables:
    runs-on: ubuntu-latest
    environment: Devlopment
    env:
      Target: abcd

    steps:
      - name: read environment variables from github
        run: |
          echo "App Id is: ${{vars.APP_ID}}" 
      
      - name: read env var from workflow
        run: |
          echo "Workflow env var is: $Target"
      
      - name: declaring steps level env var
        env:
          OS: Linux
        run: |
          echo "Step Level env is: $OS"

      - name: Print repository level env var
        run: |
          echo "repository var is ${{vars.DEPLOY_ENV}}"
      
      - name: Printing a env secret
        run : |
          echo "Repo secret is: ${{secrets.PASSWORD}}"
         

  #Expressions-conditions:
  branch-check-conditions:
    if: github.ref == 'refs/head/main'
    runs-on: ubuntu-latest

    steps:
      - name : after successs print msg
        run : |
          echo "Code was pushed on main branch"
          echo "Branch is ${{github.ref}}"
      #Yahan ${{ github.ref }} ko GitHub Actions workflow ke context se value milti hai.