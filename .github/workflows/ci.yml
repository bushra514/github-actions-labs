name : worflow-lab-1

on:
  push:
    branches:
      - features

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:
  code-check:
    name: Starting code checks
    runs-on: ubuntu-latest
     
    steps:
      - name: Check if the file exists
        uses: actions/checkout@v4

      - name: verify if the file exists
        run: test -f app/app.py

  
  #2nd job to run the tests

  test:
    name: Running the tests
    runs-on : ubuntu-latest
    needs: code-check

    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: run tests
        run: pytest -v app/

    
  build:
    name: Build the package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout the code
        uses: actions/Checkout@v4

      - name: Setup python
        uses: actions/checkout@v4
        with:
          python-version: '3.12'

      - name: create a directory
        run: | 
          mkdir -p dist
          tar -czf dist/application.tar.gz app/app.py

      - name: upload the zipped file for downloading
        uses: actions/upload-artifact@v5
        with:
          name: python-application
          path: dist/application.tar.gz


         